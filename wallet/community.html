<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METATORI WORLD · 커뮤니티</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101727;color:#fff;font:15px system-ui,sans-serif}.wrap{max-width:480px;margin:auto;padding:20px}.muted{color:#a9b7d3}.head{font-size:11px;letter-spacing:2px;color:#a9b7d3}h1{margin:4px 0 18px;font-size:25px}h2{font-size:19px;margin:24px 0 12px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs a{flex:1;text-align:center;text-decoration:none;color:#dce5ff;background:#202c46;border-radius:10px;padding:13px}.tabs .active{background:#655fc5;color:white}.card{background:#202c46;border-radius:15px;padding:18px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.small{font-size:12px}.address{overflow-wrap:anywhere;font-size:14px}.btn{border:1px solid #677794;border-radius:9px;padding:8px 12px;background:#283653;color:white;cursor:pointer}.pill{background:#394763;padding:6px 10px;border-radius:9px;font-size:12px}.filters{display:flex;gap:8px}.filters button{flex:1}.filters .on{background:#655fc5}input{width:100%;padding:13px;background:#202c46;border:1px solid #455675;color:#fff;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#202c46;border-radius:12px;padding:16px}.placeholder{height:135px;display:grid;place-items:center;background:#303d5a;border-radius:10px;color:#a9b7d3}.foot{margin-top:25px;font-size:12px;color:#9aacca}</style></head><body><main class="wrap"><div class="head">METATORI WORLD</div><h1>DREAM WALLET ✦</h1><nav class="tabs"><a class="" href="index.html">내 지갑</a><a class="active" href="community.html">커뮤니티 활동</a></nav><div class="card"><div class="row"><strong id="name">회원 정보 미연결</strong><button id="toggle" class="btn" onclick="toggle()">보기</button></div><p class="muted small">고유 드림월렛 주소</p><div id="wallet" class="address">지갑 정보 미연결</div></div><h2>나의 활동 현황</h2><div class="grid"><div class="tile"><div class="muted small">포인트</div><h2>—</h2></div><div class="tile"><div class="muted small">스타잼</div><h2>—</h2></div><div class="tile"><div class="muted small">누적 출석</div><h2>—</h2></div><div class="tile"><div class="muted small">연속 출석</div><h2>—</h2></div></div><h2>출석 체크</h2><div class="card"><p>카카오톡에서 <strong>/출석</strong>을 입력해 출석해 주세요.</p><p class="muted small">출석 기록의 웹 표시 기능은 Firebase 연동 후 활성화됩니다.</p><button class="btn" disabled>출석 기록 연결 예정</button></div><h2>내 보유 아이템</h2><div class="card muted">아이템 데이터 연결 전입니다.</div><div class="foot">디자인 테스트 · 현재 화면에서 출석이나 아이템을 임의 생성하지 않습니다.</div></main><script>
const qs=new URLSearchParams(location.search);const addr=qs.get('wallet')||'';const nick=qs.get('name')||'';let show=false;
function renderIdentity(){document.querySelector('#name').textContent=show?(nick||'회원 정보 미연결'):(nick?nick.slice(0,2)+'********':'회원 정보 미연결');document.querySelector('#wallet').textContent=show?(addr||'지갑 정보 미연결'):(addr?addr.slice(0,4)+'-****************':'지갑 정보 미연결');document.querySelector('#toggle').textContent=show?'가리기':'보기';}
function toggle(){show=!show;renderIdentity();}
document.addEventListener('DOMContentLoaded',renderIdentity);
</script></body></html>
