<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METATORI WORLD · 내 지갑</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101727;color:#fff;font:15px system-ui,sans-serif}.wrap{max-width:480px;margin:auto;padding:20px}.muted{color:#a9b7d3}.head{font-size:11px;letter-spacing:2px;color:#a9b7d3}h1{margin:4px 0 18px;font-size:25px}h2{font-size:19px;margin:24px 0 12px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs a{flex:1;text-align:center;text-decoration:none;color:#dce5ff;background:#202c46;border-radius:10px;padding:13px}.tabs .active{background:#655fc5;color:white}.card{background:#202c46;border-radius:15px;padding:18px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.small{font-size:12px}.address{overflow-wrap:anywhere;font-size:14px}.btn{border:1px solid #677794;border-radius:9px;padding:8px 12px;background:#283653;color:white;cursor:pointer}.pill{background:#394763;padding:6px 10px;border-radius:9px;font-size:12px}.filters{display:flex;gap:8px}.filters button{flex:1}.filters .on{background:#655fc5}input{width:100%;padding:13px;background:#202c46;border:1px solid #455675;color:#fff;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#202c46;border-radius:12px;padding:16px}.placeholder{height:135px;display:grid;place-items:center;background:#303d5a;border-radius:10px;color:#a9b7d3}.foot{margin-top:25px;font-size:12px;color:#9aacca}</style></head><body><main class="wrap"><div class="head">METATORI WORLD</div><h1>DREAM WALLET ✦</h1><nav class="tabs"><a class="active" href="index.html">내 지갑</a><a class="" href="community.html">커뮤니티 활동</a></nav><div class="card"><div class="row"><strong id="name">회원 정보 미연결</strong><button id="toggle" class="btn" onclick="toggle()">보기</button></div><p class="muted small">고유 드림월렛 주소</p><div id="wallet" class="address">지갑 정보 미연결</div></div><div class="row"><h2>나의 작품</h2><span class="pill" id="count">0개</span></div><div class="filters"><button class="btn on" data-type="all">전체</button><button class="btn" data-type="dream">꿈</button><button class="btn" data-type="profile">프로필</button></div><p><input id="search" placeholder="작품 번호 검색 (예: DREAM-001)" aria-label="작품 번호 검색"></p><div class="card muted" id="artworks">아직 연결된 작품이 없습니다.</div><div class="foot">디자인 테스트 · 작품 데이터는 Firebase 연결 후 표시됩니다.</div></main><script>
const qs=new URLSearchParams(location.search);const addr=qs.get('wallet')||'';const nick=qs.get('name')||'';let show=false;
function renderIdentity(){document.querySelector('#name').textContent=show?(nick||'회원 정보 미연결'):(nick?nick.slice(0,2)+'********':'회원 정보 미연결');document.querySelector('#wallet').textContent=show?(addr||'지갑 정보 미연결'):(addr?addr.slice(0,4)+'-****************':'지갑 정보 미연결');document.querySelector('#toggle').textContent=show?'가리기':'보기';}
function toggle(){show=!show;renderIdentity();}
document.addEventListener('DOMContentLoaded',renderIdentity);
</script><script>let type='all';document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('on',x===b));});document.querySelector('#search').addEventListener('input',()=>{});</script></body></html>
