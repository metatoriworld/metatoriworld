<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METATORI WORLD · 내 지갑</title><style>:root{font-family:system-ui;color:#f6f7ff;background:#101727}*{box-sizing:border-box}body{margin:0}.wrap{max-width:540px;margin:auto;padding:22px 16px 50px}.eyebrow{font-size:11px;letter-spacing:2px;color:#b5c2e1}h1{margin:4px 0 20px}nav{display:flex;gap:8px;margin-bottom:16px}nav a{flex:1;text-align:center;padding:12px 4px;border:1px solid #55617b;border-radius:10px;color:#fff;text-decoration:none}nav .on,.primary{background:#7367d8;border-color:#7367d8}.panel,.art{background:#202c46;border-radius:14px;padding:16px;margin-bottom:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.sub{font-size:12px;color:#aebbd8}.address{overflow-wrap:anywhere}button{border:0;border-radius:9px;padding:10px 13px;background:#3a4967;color:#fff;cursor:pointer}input{width:100%;padding:12px;background:#111b31;color:#fff;border:1px solid #56647d;border-radius:9px;margin:8px 0 12px}.tabs{display:flex;gap:7px;margin-bottom:12px}.tabs button{flex:1}.tabs .on{background:#7367d8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.art{margin:0;padding:10px}.artpic{display:grid;place-items:center;aspect-ratio:1;background:#384a74;border-radius:10px;font-size:52px}.hide{display:none}.hint{font-size:12px;line-height:1.6;color:#aebbd8}</style><main class="wrap"><div class="eyebrow">METATORI WORLD</div><h1>DREAM WALLET</h1><nav><a class="on" href="index.html">내 지갑</a><a href="community.html">커뮤니티 활동</a></nav><section class="panel" id="create"><h2>드림월렛 만들기</h2><p class="sub">화면 확인용 임시 생성입니다. 실제 카카오봇 지갑과 연결되지 않습니다.</p><input id="nick" placeholder="회원 닉네임"><button class="primary" id="make">테스트 지갑 생성</button><p id="error" class="sub"></p></section><section id="owned" class="hide"><div class="panel"><div class="row"><b>MY DREAM WALLET</b><button id="toggle">보기</button></div><hr style="border:0;border-top:1px solid #40506c;margin:16px 0"><div class="sub">회원 아이디</div><p id="shownNick"></p><div class="sub">고유 지갑 주소</div><div class="row"><b id="shownWallet" class="address"></b><button id="copy">복사</button></div></div><div class="row"><h2>나의 작품</h2><span class="sub">총 0개</span></div><div class="tabs"><button class="on" data-tab="all">전체</button><button data-tab="dream">꿈</button><button data-tab="profile">프로필</button></div><input id="search" placeholder="작품 번호 검색 (예: DREAM-001)"><div class="panel" id="empty">아직 등록된 작품이 없습니다.</div></section><p class="hint">현재 GitHub 화면 테스트용입니다. 회원·작품·출석 데이터는 Firebase에 연결한 뒤 실제로 표시됩니다.</p></main><script>const KEY="mtw_wallet_page_test_v1",$=id=>document.getElementById(id);let visible=false;function get(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function mask(s,n){return s.slice(0,n)+"*".repeat(Math.max(0,s.length-n))}function render(){let m=get();$("create").classList.toggle("hide",!!m);$("owned").classList.toggle("hide",!m);if(!m)return;$("shownNick").textContent=visible?m.nickname:mask(m.nickname,2);$("shownWallet").textContent=visible?m.wallet:mask(m.wallet,4);$("toggle").textContent=visible?"가리기":"보기";$("empty").textContent="아직 등록된 작품이 없습니다."}function newWallet(){let a=new Uint8Array(8);crypto.getRandomValues(a);let s=Array.from(a,x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();return "MTW-"+s.slice(0,4)+"-"+s.slice(4,8)+"-"+s.slice(8,12)+"-"+s.slice(12,16)}$("make").onclick=()=>{let n=$("nick").value.trim();if(n.length<2){$("error").textContent="닉네임을 입력해 주세요.";return}localStorage.setItem(KEY,JSON.stringify({nickname:n,wallet:newWallet(),days:[]}));render()};$("toggle").onclick=()=>{visible=!visible;render()};$("copy").onclick=()=>{let m=get();if(m)navigator.clipboard.writeText(m.wallet).then(()=>$("copy").textContent="복사됨").catch(()=>$("copy").textContent="복사 실패")};document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));$("empty").textContent="해당 분류에 등록된 작품이 없습니다."});$("search").oninput=()=>{$("empty").textContent="검색된 작품이 없습니다."};render()</script></html>
