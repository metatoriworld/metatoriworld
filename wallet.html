<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1021"><title>METATORI WORLD</title><style>
:root{color-scheme:dark;--bg:#0a1020;--surface:#151e35;--surface2:#1b2743;--line:#303d5b;--text:#f5f7ff;--muted:#9faecb;--accent:#9a8cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -15%,#24335b 0%,#0a1020 55%);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.layout{max-width:1160px;margin:auto;padding:24px 20px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:36px}.logo{font-size:16px;letter-spacing:2px;font-weight:900}.logo span{color:#b2a6ff}.nav{display:flex;gap:8px}.nav a{padding:11px 17px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:14px}.nav a.active{background:#6354b3;color:white;border-color:#6354b3}.hero{padding:32px;border:1px solid #344363;border-radius:26px;background:linear-gradient(125deg,#26355b,#151d37 65%,#191936);margin-bottom:24px}.eyebrow{font-size:12px;color:#b8afff;letter-spacing:2px;font-weight:800}h1{font-size:clamp(27px,4vw,42px);margin:10px 0}h2{font-size:20px;margin:0 0 16px}.desc{color:#b9c5df;line-height:1.7;margin:0}.columns{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:23px;margin-bottom:20px}.sub{color:var(--muted);font-size:13px;line-height:1.7}.field{display:flex;gap:9px;margin-top:16px}input{width:100%;min-width:0;background:#0c152a;color:#fff;border:1px solid #425171;border-radius:12px;padding:13px;font-size:15px}button,.action{border:0;background:#7868dc;color:#fff;border-radius:12px;padding:13px 17px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}.action.secondary{background:#263654}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{padding:19px;border-radius:15px;background:var(--surface2);border:1px solid #32415d}.stat .number{font-size:clamp(21px,3vw,30px);font-weight:800;margin-top:10px;overflow-wrap:anywhere}.label{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.value{font-weight:700;overflow-wrap:anywhere}.divider{height:1px;background:var(--line);margin:17px 0}.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quick a{display:block;padding:19px;background:var(--surface2);border-radius:15px;border:1px solid var(--line)}.quick b{display:block;margin-bottom:8px}.placeholder{border:1px dashed #4b5876;border-radius:14px;padding:26px;text-align:center;color:var(--muted);line-height:1.6}.foot{margin-top:25px;text-align:center;color:#7786a5;font-size:12px}.status{font-size:13px;color:#c2d0ed;line-height:1.6;margin-top:12px}.pill{border-radius:99px;background:#2c3a60;color:#c2baff;padding:6px 10px;font-size:12px}.small{font-size:13px;color:var(--muted)}@media(max-width:760px){.layout{padding:17px 14px 96px}.top{display:block;margin-bottom:23px}.logo{margin:4px 0 18px}.nav{display:grid;grid-template-columns:repeat(3,1fr)}.nav a{text-align:center;padding:12px 5px;font-size:13px}.hero{padding:24px 20px;border-radius:20px}.columns{grid-template-columns:1fr;gap:0}.panel{padding:19px;margin-bottom:14px}.stat{padding:15px}.field{flex-direction:column}.field button{width:100%}}@media(min-width:761px){.panel{min-height:120px}}
</style></head><body><div class="layout"><header class="top"><div class="logo">✦ <span>METATORI</span> WORLD</div><nav class="nav"><a href="./index.html" data-nav="home">홈</a><a href="./wallet.html" data-nav="wallet">내 지갑</a><a href="./community.html" data-nav="community">커뮤니티</a></nav></header><main id="content"></main><footer class="foot">METATORI WORLD · 보이지 않는 꿈이 사라지지 않도록.</footer></div><script>
const page="wallet";
document.querySelector('[data-nav="'+page+'"]').classList.add("active");
const base="https://metatoriworld-17096-default-rtdb.asia-southeast1.firebasedatabase.app";
const savedWallet=sessionStorage.getItem("mtw_wallet")||"";
const queryWallet=new URLSearchParams(location.search).get("wallet")||"";
const currentWallet=queryWallet||savedWallet;
function safe(v){return String(v??"—").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const stat=(label,value)=>'<div class="stat"><div class="label">'+label+'</div><div class="number">'+safe(value)+'</div></div>';
function walletForm(){return '<section class="panel"><h2>내 지갑 조회</h2><p class="sub">카카오톡에서 /지갑생성으로 받은 고유 지갑 주소를 입력하세요.</p><div class="field"><input id="wallet-input" placeholder="MTW-XXXX-XXXX-XXXX" aria-label="고유 지갑 주소" value="'+safe(currentWallet)+'"><button id="load">불러오기</button></div><div id="status" class="status">지갑 주소로 활동 기록을 조회할 수 있어요.</div></section>'}
const hero=(label,title,description)=>'<section class="hero"><div class="eyebrow">'+label+'</div><h1>'+title+'</h1><p class="desc">'+description+'</p></section>';
let main=document.getElementById("content");
if(page==="home")main.innerHTML=hero("WELCOME TO METATORI WORLD","꿈이 모이는 작은 세계","카카오톡에서 만들어진 나의 드림월렛과 활동 기록을 이곳에서 확인하세요.")+'<div class="columns"><div><section class="panel"><h2>메타토리월드</h2><p class="desc">잊고 지내던 꿈도 이곳에서는 하나의 별이 됩니다.</p><div class="divider"></div><p class="sub">카카오톡에서 /지갑생성 → /출석 → 웹페이지에서 내 활동 확인</p></section></div><div><section class="panel"><h2>바로가기</h2><div class="quick"><a href="./wallet.html"><b>🌙 내 지갑</b><span class="small">회원 정보와 작품</span></a><a href="./community.html"><b>✨ 커뮤니티</b><span class="small">출석과 포인트</span></a></div></section></div></div>';
if(page==="wallet")main.innerHTML=hero("MY DREAM WALLET","나의 드림월렛","카카오톡에서 발급된 고유 지갑 주소와 나의 꿈 작품을 확인하는 공간.")+'<div class="columns"><div>'+walletForm()+'<section class="panel"><h2>회원 정보</h2><div class="row"><span class="label">닉네임</span><span class="value" id="nickname">—</span></div><div class="divider"></div><div class="row"><span class="label">지갑 주소</span><span class="value" id="address">—</span></div><div class="divider"></div><div class="row"><span class="label">가입일</span><span class="value" id="joined">—</span></div></section></div><div><section class="panel"><div class="row"><h2>나의 작품</h2><span class="pill">준비 중</span></div><div class="placeholder">🌌<p>등록된 작품이 여기에 표시됩니다.</p></div></section></div></div>';
if(page==="community")main.innerHTML=hero("COMMUNITY ACTIVITY","나의 활동 기록","카카오톡에서 출석하고 모은 포인트와 경험치를 확인하세요.")+'<div class="columns"><div>'+walletForm()+'<section class="panel"><h2>회원 정보</h2><div class="row"><span class="label">닉네임</span><span class="value" id="nickname">—</span></div><div class="divider"></div><div class="row"><span class="label">지갑 주소</span><span class="value" id="address">—</span></div></section><section class="panel"><h2>출석 안내</h2><p class="sub">카카오톡에서 /출석 명령어를 입력하면 활동 기록과 포인트가 적립됩니다.</p></section></div><div><section class="panel"><h2>활동 현황</h2><div class="statgrid" id="stats">'+stat("레벨","—")+stat("포인트","—")+stat("경험치","—")+stat("스타잼","—")+stat("누적 출석","—")+stat("연속 출석","—")+stat("최다 연속","—")+stat("최근 출석","—")+'</div></section></div></div>';
async function loadWallet(){
 const input=document.getElementById("wallet-input"),status=document.getElementById("status");if(!input)return;
 const id=input.value.trim().toUpperCase();
 if(!/^MTW-[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}$/.test(id)){status.textContent="올바른 지갑 주소를 입력해 주세요.";return}
 status.textContent="Firebase에서 조회 중...";
 try{const response=await fetch(base+"/dreamWallet/members/"+encodeURIComponent(id)+".json",{cache:"no-store"});
 if(!response.ok)throw Error("Firebase 읽기 권한 또는 네트워크 오류 (HTTP "+response.status+")");
 const m=await response.json();if(!m||m.wallet!==id){status.textContent="해당 지갑의 데이터가 없습니다.";return}
 sessionStorage.setItem("mtw_wallet",id);
 document.getElementById("nickname").textContent=m.nickname||"—";document.getElementById("address").textContent=m.wallet||id;
 if(page==="wallet")document.getElementById("joined").textContent=m.joinedAt||"—";
 if(page==="community"){const a=m.attendance||{};document.getElementById("stats").innerHTML=stat("레벨",m.level||1)+stat("포인트",m.points||0)+stat("경험치",m.xp||0)+stat("스타잼",m.starGems||0)+stat("누적 출석",a.total||0)+stat("연속 출석",a.streak||0)+stat("최다 연속",a.maxStreak||0)+stat("최근 출석",a.lastDate||"—")}
 document.querySelectorAll(".nav a").forEach(a=>{if(a.href.includes("wallet.html")||a.href.includes("community.html"))a.href=a.href.split("?")[0]+"?wallet="+encodeURIComponent(id)});
 status.textContent="Firebase 데이터 조회 완료";
 }catch(e){status.textContent="조회 실패: "+e.message}
}
if(page!=="home"){document.getElementById("load").onclick=loadWallet;document.getElementById("wallet-input").addEventListener("keydown",e=>{if(e.key==="Enter")loadWallet()});if(currentWallet)loadWallet()}
</script></body></html>
