<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>METATORI WORLD | 내 지갑</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1325;color:#f6f4ff;font-family:system-ui,sans-serif}.wrap{max-width:510px;margin:auto;padding:22px 17px 60px}.brand{font-size:11px;letter-spacing:2px;color:#adbbdd}h1{font-size:26px;margin:6px 0 20px}h2{font-size:19px;margin:23px 0 12px}.nav{display:flex;gap:7px;margin-bottom:18px}.nav a{flex:1;text-align:center;padding:11px 4px;background:#202c49;color:#dce4ff;text-decoration:none;border-radius:10px;font-size:13px}.nav .on{background:#7563d6;color:white}.card{background:#202b45;border:1px solid #344260;border-radius:16px;padding:17px;margin-bottom:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.muted{font-size:12px;color:#aebcdb;line-height:1.6}.addr{font-size:13px;overflow-wrap:anywhere}button{background:#384765;border:0;border-radius:9px;color:white;padding:9px 12px;cursor:pointer}.filters{display:flex;gap:7px}.filters button{flex:1}.filters .on{background:#7563d6}input{width:100%;padding:12px;border-radius:9px;border:1px solid #53627c;background:#111c32;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#202b45;border:1px solid #344260;border-radius:13px;padding:15px}.value{font-size:22px;font-weight:700;margin-top:8px}.note{margin-top:24px;color:#aebcdb;font-size:12px;line-height:1.6}</style></head><body><main class="wrap"><div class="brand">METATORI WORLD</div><h1>MY DREAM WALLET</h1><nav class="nav"><a href="./index.html">홈</a><a class="on" href="./wallet.html">내 지갑</a><a class="" href="./community.html">커뮤니티</a></nav><div class="card"><b>Firebase 회원 연결</b><p class="muted">Firebase 계정으로 로그인하면 내 지갑과 활동 정보를 불러옵니다.</p><input id="email" type="email" placeholder="Firebase 로그인 이메일" autocomplete="username"><p><input id="password" type="password" placeholder="비밀번호" autocomplete="current-password"></p><button id="login">로그인하고 불러오기</button> <button id="logout">로그아웃</button><p class="muted" id="sync-status" role="status">로그인이 필요합니다.</p></div><div class="card"><div class="row"><b>회원 정보</b><button id="toggle">보기</button></div><p class="muted">닉네임</p><div id="nickname">연동 대기 중</div><p class="muted">고유 지갑 주소</p><div class="row"><span id="address" class="addr">연동 대기 중</span><button id="copy">복사</button></div></div><div class="row"><h2>나의 작품</h2><span class="muted">0개</span></div><div class="filters"><button class="on" data-filter="all">전체</button><button data-filter="dream">꿈</button><button data-filter="profile">프로필</button></div><p><input id="search" placeholder="작품 번호 검색"></p><div class="card muted" id="empty">아직 등록된 작품이 없습니다.</div><div class="note">현재 디자인 테스트 단계입니다. 지갑과 작품은 Firebase 연동 후 본인 확인을 거쳐 표시됩니다.</div></main><script>let shown=false;const qs=new URLSearchParams(location.search);const nickname=qs.get("name")||"";const wallet=qs.get("wallet")||"";function update(){document.getElementById("nickname").textContent=nickname?(shown?nickname:nickname.slice(0,2)+"••••••"):"Firebase 회원 연동 전";document.getElementById("address").textContent=wallet?(shown?wallet:wallet.slice(0,4)+"-••••-••••-••••"):"Firebase 지갑 연동 전";document.getElementById("toggle").textContent=shown?"가리기":"보기"}document.getElementById("toggle").onclick=()=>{shown=!shown;update()};document.getElementById("copy").onclick=()=>{if(!wallet)return; navigator.clipboard.writeText(wallet).then(()=>document.getElementById("copy").textContent="복사됨")};update()</script><script>document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("on",x===b));document.getElementById("empty").textContent="해당 분류에 등록된 작품이 없습니다."});document.getElementById("search").oninput=()=>{document.getElementById("empty").textContent="검색된 작품이 없습니다."}</script><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {getDatabase,ref,get} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyAIEnqTT-k094W-JOXDyXeFRdynKfy323I",authDomain:"metatoriworld-17096.firebaseapp.com",databaseURL:"https://metatoriworld-17096-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"metatoriworld-17096",appId:"1:657765446565:web:971fa5c42f06eb8cc56e4c"});
const auth=getAuth(app),database=getDatabase(app),status=document.getElementById("sync-status");
const walletInput=new URLSearchParams(location.search).get("wallet");
document.getElementById("login").onclick=async()=>{try{status.textContent="로그인 중...";await signInWithEmailAndPassword(auth,document.getElementById("email").value,document.getElementById("password").value);document.getElementById("password").value="";}catch(e){status.textContent="로그인 실패: "+e.code;}};
document.getElementById("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{
 if(!user){status.textContent="로그인이 필요합니다.";return;}
 if(!walletInput){status.textContent="로그인 성공. 카카오톡에서 받은 개인 지갑 링크로 접속해 주세요.";return;}
 try{
  status.textContent="Firebase 회원 데이터 조회 중...";
  const snap=await get(ref(database,"dreamWallet/members/"+walletInput));
  if(!snap.exists()){status.textContent="해당 지갑의 데이터가 없습니다. 봇에서 /동기화 해 주세요.";return;}
  const m=snap.val();
  if(m.ownerUid!==user.uid){status.textContent="본인 확인이 설정되지 않은 지갑입니다. 지갑 소유자 연결이 필요합니다.";return;}
  document.getElementById("nickname").textContent=m.nickname||"";
  document.getElementById("address").textContent=m.wallet||"";
  
  status.textContent="Firebase 데이터 연결 완료";
 }catch(e){status.textContent="조회 실패: Firebase 접근 권한 또는 연결 상태를 확인하세요.";}
});
</script></body></html>
